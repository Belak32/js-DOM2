<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Галерея з Picsum</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Моя атмосферна фотогалерея</h1>

  <div id="gallery" class="gallery"></div>

  <div class="controls">
    <button id="loadMore">Завантажити ще 4</button>
    <button id="clearGallery">Очистити</button>
    <button id="removeLast">Видалити останню</button>
    <button id="reverseGallery">Перевернути</button>
  </div>

  <script type="module" src="script.js"></script>

</body>
</html>
